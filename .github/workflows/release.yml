name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          sudo apt-get update && sudo apt-get install -y luajit
          luajit tests/run.lua
          luajit tests/smoke.lua

      - name: Build zip
        id: build
        run: echo "zip=$(scripts/build.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" --title "Emberpath $GITHUB_REF_NAME" --generate-notes
